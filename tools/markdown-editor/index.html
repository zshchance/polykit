<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 手札 · 即开宝匣</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('static-toolkit-theme');
          var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- 编辑器类工具需要尽量大的纵向空间：进入编辑现场时由脚本切换为 h-screen（内部滚动） -->
    <div id="app" class="mx-auto flex min-h-screen max-w-[1700px] flex-col px-4 py-5"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
