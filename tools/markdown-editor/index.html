<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 手札 · 即开宝匣</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('static-toolkit-theme');
          var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- 自然文档流：页眉/页脚随页面滚走，编辑现场的常驻件（工具栏/状态栏/大纲）由样式吸顶吸底 -->
    <div id="app" class="mx-auto flex min-h-screen w-full max-w-[1700px] flex-col px-4 py-4"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
