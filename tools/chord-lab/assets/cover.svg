<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200">
  <defs>
    <linearGradient id="cov-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="0.55" stop-color="#14532d"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="cov-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfcf7"/>
      <stop offset="1" stop-color="#ddd8c8"/>
    </linearGradient>
  </defs>
  <rect width="480" height="200" fill="url(#cov-bg)"/>

  <!-- 五线谱 + 和弦音簇（上半） -->
  <g stroke="#bbf7d0" stroke-width="1" opacity="0.5">
    <line x1="40" y1="46" x2="440" y2="46"/>
    <line x1="40" y1="54" x2="440" y2="54"/>
    <line x1="40" y1="62" x2="440" y2="62"/>
    <line x1="40" y1="70" x2="440" y2="70"/>
    <line x1="40" y1="78" x2="440" y2="78"/>
  </g>
  <text x="48" y="86" font-size="42" fill="#d6f5e3" font-family="serif">𝄞</text>

  <!-- 1564 走向：四个和弦音簇，逐个点亮 -->
  <g>
    <!-- I -->
    <g fill="#38bdf8">
      <ellipse cx="140" cy="62" rx="6" ry="4.4" transform="rotate(-16 140 62)"/>
      <ellipse cx="140" cy="46" rx="6" ry="4.4" transform="rotate(-16 140 46)"/>
      <ellipse cx="140" cy="30" rx="6" ry="4.4" transform="rotate(-16 140 30)"/>
    </g>
    <!-- V -->
    <g fill="#38bdf8" opacity="0.85">
      <ellipse cx="215" cy="54" rx="6" ry="4.4" transform="rotate(-16 215 54)"/>
      <ellipse cx="215" cy="38" rx="6" ry="4.4" transform="rotate(-16 215 38)"/>
      <ellipse cx="215" cy="26" rx="6" ry="4.4" transform="rotate(-16 215 26)"/>
    </g>
    <!-- vi -->
    <g fill="#7dd3fc" opacity="0.55">
      <ellipse cx="290" cy="58" rx="6" ry="4.4" transform="rotate(-16 290 58)"/>
      <ellipse cx="290" cy="42" rx="6" ry="4.4" transform="rotate(-16 290 42)"/>
      <ellipse cx="290" cy="34" rx="6" ry="4.4" transform="rotate(-16 290 34)"/>
    </g>
    <!-- IV（未到，灰） -->
    <g fill="#cbd5e1" opacity="0.3">
      <ellipse cx="365" cy="58" rx="6" ry="4.4" transform="rotate(-16 365 58)"/>
      <ellipse cx="365" cy="42" rx="6" ry="4.4" transform="rotate(-16 365 42)"/>
      <ellipse cx="365" cy="26" rx="6" ry="4.4" transform="rotate(-16 365 26)"/>
    </g>
  </g>

  <!-- 便携键盘（下半） -->
  <g>
    <rect x="40" y="120" width="400" height="56" rx="6" fill="#0c0c0f"/>
    <g>
      <rect x="48" y="126" width="42" height="46" rx="3" fill="url(#cov-key)"/>
      <rect x="94" y="126" width="42" height="46" rx="3" fill="url(#cov-key)"/>
      <rect x="140" y="126" width="42" height="46" rx="3" fill="#4ade80"/>
      <rect x="186" y="126" width="42" height="46" rx="3" fill="url(#cov-key)"/>
      <rect x="232" y="126" width="42" height="46" rx="3" fill="#86efac"/>
      <rect x="278" y="126" width="42" height="46" rx="3" fill="url(#cov-key)"/>
      <rect x="324" y="126" width="42" height="46" rx="3" fill="url(#cov-key)"/>
      <rect x="370" y="126" width="42" height="46" rx="3" fill="url(#cov-key)"/>
      <rect x="82" y="126" width="24" height="28" rx="2.5" fill="#17171b"/>
      <rect x="128" y="126" width="24" height="28" rx="2.5" fill="#17171b"/>
      <rect x="220" y="126" width="24" height="28" rx="2.5" fill="#17171b"/>
      <rect x="266" y="126" width="24" height="28" rx="2.5" fill="#17171b"/>
      <rect x="312" y="126" width="24" height="28" rx="2.5" fill="#17171b"/>
    </g>
  </g>
</svg>
