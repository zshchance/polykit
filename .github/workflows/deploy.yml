# 部署到 GitHub Pages（项目页子路径，作为 Cloudflare 主站的镜像）。
# 触发：推送到 main 分支，或手动在 Actions 页运行。
#
# 关键：注入 BASE_PATH=/<repo>/，使 Vite 把资源/链接路径都加上子路径前缀，
# 否则部署到 username.github.io/<repo>/ 后资源会 404。
# 同时注入 SITE_URL（含子路径）作为 canonical 前缀，
# 保证镜像与 Cloudflare 主站产出同一 canonical（利 SEO，避免重复内容）。
# （Cloudflare Pages 不用本 workflow，它在后台连 Git 自行构建，
#   根路径部署不设 BASE_PATH，但同样应设 SITE_URL 保持 canonical 一致。）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # ← 部署到子路径 /<repo>/。仓库名改动时同步修改此处。
          BASE_PATH: /polykit/
          # canonical 前缀（含子路径）。改仓库名/用户名时同步修改。
          SITE_URL: https://zshchance.github.io/polykit
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
