<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 系统配置页非内容工具：不进搜索引擎索引（sitemap 也不会收录） -->
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="即开宝匣的 AI 大模型接入配置：添加供应商（OpenAI 兼容 / Anthropic）、管理 API 密钥与多模态模型、设置调用优先级。密钥仅存本浏览器，一次配置全站工具共用。"
    />
    <title>AI 接入设置 · 即开宝匣</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('static-toolkit-theme');
          var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app" class="mx-auto max-w-4xl px-4 py-10 min-h-screen"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
